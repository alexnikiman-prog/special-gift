<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #050810; overflow: hidden; color: #fff; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #intro-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #050810; z-index: 200; display: flex; justify-content: center; align-items: center; transition: opacity 1s; }
        #intro-btn { background: none; border: 2px solid #38bdf8; color: #38bdf8; padding: 15px 40px; font-size: 18px; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); transition: 0.3s; }
        #intro-btn:hover { background: #38bdf8; color: #000; }
        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .container { width: 90%; max-width: 450px; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); padding: 25px; text-align: center; z-index: 10; display: none; opacity: 0; transition: 1.5s; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .show-box { display: block !important; opacity: 1 !important; }
        /* استایل مخصوص عکس مستطیلی تو */
        .profile-img { width: 100%; height: auto; max-height: 300px; border-radius: 20px; margin-bottom: 20px; object-fit: cover; border: 2px solid rgba(56, 189, 248, 0.5); box-shadow: 0 0 30px rgba(56, 189, 248, 0.2); }
        #typing-text { font-size: 19px; line-height: 1.8; color: #e2e8f0; min-height: 100px; margin-bottom: 20px; direction: rtl; }
        textarea { width: 100%; height: 100px; background: rgba(0, 0, 0, 0.4); border-radius: 15px; color: #fff; padding: 15px; border: 1px solid #38bdf8; resize: none; outline: none; margin-bottom: 10px; font-family: inherit; box-sizing: border-box; }
        .btn { width: 100%; padding: 16px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; background: linear-gradient(90deg, #38bdf8, #818cf8); color: #0f172a; font-size: 16px; }
        #heart-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .heart { position: absolute; font-size: 25px; animation: fall linear infinite; opacity: 0.8; }
        @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>
    <div id="intro-page"><button id="intro-btn" onclick="startMagic()">OPEN YOUR GIFT 🎁</button></div>
    <canvas id="particles"></canvas>
    <div id="heart-container"></div>
    
    <div class="container" id="mainContainer">
        <img src="photo.jpg" class="profile-img" onerror="this.src='https://via.placeholder.com/400x300?text=Photo+Not+Found'">
        <h2 style="color: #38bdf8; margin-top: 0;">FOR YOU... 🥺</h2>
        <div id="typing-text"></div>
        <div id="creatorArea">
            <textarea id="textInput" placeholder="پیام آشتی رو اینجا بنویس..."></textarea>
            <button id="mainBtn" class="btn" onclick="process()">CREATE MAGIC LINK ✨</button>
            <div id="linkOutput" style="display:none; margin-top:20px; font-size:12px; color:#38bdf8; word-break:break-all; border:1px dashed rgba(56, 189, 248, 0.5); padding:10px; border-radius:10px; background: rgba(0,0,0,0.2);"></div>
        </div>
    </div>

    <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <script>
        let fullText = ""; let index = 0;
        const hash = window.location.hash.substring(1);
        if (hash) {
            try { 
                fullText = decodeURIComponent(escape(atob(hash))); 
                document.getElementById('creatorArea').style.display = "none"; 
            } catch(e) { console.log("Error decoding"); }
        }

        function startMagic() {
            document.getElementById('intro-page').style.opacity = '0';
            const audio = document.getElementById('bgMusic');
            audio.play().catch(e => console.log("Music interaction required"));
            
            setTimeout(() => {
                document.getElementById('intro-page').style.display = 'none';
                document.getElementById('mainContainer').classList.add('show-box');
                initParticles();
                if (fullText) { 
                    typeWriter(); 
                    setInterval(createHeart, 300); 
                }
            }, 1000);
        }

        function typeWriter() {
            if (index < fullText.length) {
                document.getElementById("typing-text").innerHTML += fullText.charAt(index);
                index++; setTimeout(typeWriter, 60);
            }
        }

        function createHeart() {
            const h = document.createElement('div'); h.className = 'heart';
            const em = ['🥺', '💖', '🩹', '🤍', '✨', '🌹'];
            h.innerHTML = em[Math.floor(Math.random() * em.length)];
            h.style.left = Math.random() * 100 + 'vw';
            h.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.getElementById('heart-container').appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }

        function initParticles() {
            const canvas = document.getElementById('particles'); const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            let pArray = [];
            for (let i = 0; i < 80; i++) { 
                pArray.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2, o: Math.random()*0.5 }); 
            }
            function anim() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                pArray.forEach(p => {
                    ctx.fillStyle = rgba(255,255,255,${p.o}); ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
                    p.y -= 0.4; if(p.y < 0) p.y = canvas.height;
                });
                requestAnimationFrame(anim);
            }
            anim();
        }

        function process() {
            const txt = document.getElementById('textInput').value;
            if (!txt) return;
            const b64 = btoa(unescape(encodeURIComponent(txt)));
            const link = window.location.origin + window.location.pathname + "#" + b64;
            const out = document.getElementById('linkOutput');
            out.style.display = 'block'; out.innerText = link;
            navigator.clipboard.writeText(link);
            alert("لینک جادویی کپی شد! حالا برای دوستت بفرست.");
        }
    </script>
</body>
</html>

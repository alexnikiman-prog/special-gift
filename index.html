<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise</title>
    <style>
        body { margin: 0; background: #050810; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #intro-page { position: fixed; width: 100%; height: 100%; background: #050810; display: flex; justify-content: center; align-items: center; z-index: 100; }
        #intro-btn { background: #38bdf8; color: black; border: none; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; }
        .container { text-align: center; display: none; width: 85%; max-width: 400px; background: rgba(255,255,255,0.05); padding: 25px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        /* تنظیم برای عکس مستطیل */
        .profile-img { width: 100%; height: auto; max-height: 250px; border-radius: 15px; object-fit: cover; margin-bottom: 20px; border: 2px solid #38bdf8; display: block; }
        #typing-text { font-size: 18px; line-height: 1.6; margin-bottom: 20px; min-height: 50px; }
        textarea { width: 100%; height: 100px; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.3); color: white; border: 1px solid #38bdf8; box-sizing: border-box; }
        .magic-btn { background: #38bdf8; border: none; padding: 12px 25px; border-radius: 25px; color: #000; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

<div id="intro-page">
    <button id="intro-btn" onclick="start()">OPEN YOUR GIFT 🎁</button>
</div>

<div class="container" id="mainBox">
    <!-- عکس اینجا لود می‌شود -->
    <img src="photo.jpg" class="profile-img">
    <div id="typing-text"></div>
    
    <div id="creatorArea">
        <textarea id="textInput" placeholder="پیام آشتی رو اینجا بنویس..."></textarea>
        <button class="magic-btn" onclick="makeLink()">ساخت لینک جادویی ✨</button>
        <p id="resultLink" style="font-size: 10px; color: #38bdf8; margin-top: 15px; word-break: break-all;"></p>
    </div>
</div>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
    const hash = window.location.hash.substring(1);
    let index = 0;
    let fullText = "";

    if (hash) {
        try {
            fullText = decodeURIComponent(escape(atob(hash)));
            document.getElementById('creatorArea').style.display = 'none';
        } catch(e) { console.log("Error"); }
    }

    function start() {
        document.getElementById('intro-page').style.display = 'none';
        document.getElementById('mainBox').style.display = 'block';
        document.getElementById('bgMusic').play().catch(e => console.log("Audio blocked"));
        if (fullText) typeWriter();
    }

    function typeWriter() {
        if (index < fullText.length) {
            document.getElementById("typing-text").innerHTML += fullText.charAt(index);
            index++;
            setTimeout(typeWriter, 50);
        }
    }

    function makeLink() {
        const val = document.getElementById('textInput').value;
        if(!val) return;
        const encoded = btoa(unescape(encodeURIComponent(val)));
        const finalLink = window.location.origin + window.location.pathname + "#" + encoded;
        document.getElementById('resultLink').innerText = finalLink;
        navigator.clipboard.writeText(finalLink);
        alert("لینک کپی شد!");
    }
</script>

</body>
</html>

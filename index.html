<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Gift</title>
    <style>
        body { margin: 0; background: #050810; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #intro-page { position: fixed; width: 100%; height: 100%; background: #050810; display: flex; justify-content: center; align-items: center; z-index: 100; }
        #intro-btn { background: #38bdf8; color: black; border: none; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; }
        .container { text-align: center; display: none; padding: 20px; }
        .profile-img { width: 150px; height: 150px; border-radius: 50%; border: 3px solid #38bdf8; margin-bottom: 20px; }
        textarea { width: 280px; height: 100px; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
        #magic-btn { background: #818cf8; border: none; padding: 10px 20px; border-radius: 20px; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div id="intro-page">
    <button id="intro-btn" onclick="start()">OPEN YOUR GIFT 🎁</button>
</div>

<div class="container" id="mainBox">
    <img src="photo.jpg" class="profile-img">
    <div id="textDisplay" style="font-size: 20px; margin-bottom: 20px;"></div>
    
    <div id="creatorArea">
        <textarea id="textInput" placeholder="پیام آشتی رو اینجا بنویس..."></textarea><br>
        <button id="magic-btn" onclick="makeLink()">ساخت لینک جادویی ✨</button>
        <p id="resultLink" style="font-size: 10px; color: #38bdf8; margin-top: 10px; word-break: break-all;"></p>
    </div>
</div>

<audio id="music" src="music.mp3" loop></audio>

<script>
    const hash = window.location.hash.substring(1);
    
    function start() {
        document.getElementById('intro-page').style.display = 'none';
        document.getElementById('mainBox').style.display = 'block';
        
        if (hash) {
            // حالت نمایش پیام برای دوستت
            document.getElementById('creatorArea').style.display = 'none';
            const message = decodeURIComponent(escape(atob(hash)));
            document.getElementById('textDisplay').innerText = message;
            document.getElementById('music').play().catch(err => console.log("Music blocked"));
        }
    }

    function makeLink() {
        const val = document.getElementById('textInput').value;
        const encoded = btoa(unescape(encodeURIComponent(val)));
        const finalLink = window.location.origin + window.location.pathname + "#" + encoded;
        document.getElementById('resultLink').innerText = finalLink;
        alert("لینک کپی شد!");
    }
</script>

</body>
</html>

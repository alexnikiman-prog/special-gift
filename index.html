<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برای تو...</title>
    <style>
        body { margin: 0; background: #050810; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; position: relative; }
        .container { text-align: center; width: 90%; max-width: 450px; background: rgba(255,255,255,0.05); padding: 25px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); z-index: 10; margin-bottom: 60px; }
        .profile-img { width: 100%; height: auto; max-height: 350px; border-radius: 15px; object-fit: cover; margin-bottom: 20px; border: 2px solid #38bdf8; }
        #typing-text { font-size: 19px; line-height: 1.8; margin-bottom: 20px; direction: rtl; min-height: 50px; }
        
        /* دکمه پخش آهنگ در پایین صفحه */
        .music-control { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; }
        .music-btn { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #38bdf8; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-size: 14px; backdrop-filter: blur(5px); transition: 0.3s; }
        .music-btn:hover { background: #38bdf8; color: #000; }

        #creatorArea { margin-top: 20px; }
        textarea { width: 100%; height: 80px; border-radius: 10px; padding: 10px; background: rgba(0,0,0,0.3); color: white; border: 1px solid #38bdf8; box-sizing: border-box; margin-bottom: 10px; }
        .magic-btn { background: #38bdf8; border: none; padding: 12px 25px; border-radius: 25px; color: #000; font-weight: bold; cursor: pointer; width: 100%; }
        .heart { position: absolute; font-size: 20px; animation: fall 4s linear infinite; pointer-events: none; }
        @keyframes fall { 0% { transform: translateY(-10vh); opacity: 1; } 100% { transform: translateY(110vh); opacity: 0; } }
    </style>
</head>
<body>

<div class="container" id="mainBox">
    <img src="photo.jpg" class="profile-img">
    <div id="typing-text"></div>
    
    <div id="creatorArea">
        <textarea id="textInput" placeholder="پیام آشتی رو اینجا بنویس..."></textarea>
        <button class="magic-btn" onclick="makeLink()">ساخت لینک جادویی ✨</button>
        <p id="resultLink" style="font-size: 10px; color: #38bdf8; margin-top: 15px; word-break: break-all;"></p>
    </div>
</div>

<div class="music-control" id="musicBar" style="display: none;">
    <button class="music-btn" onclick="toggleMusic()" id="btnText">پخش آهنگ 🎧</button>
</div>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
    const hash = window.location.hash.substring(1);
    let index = 0;
    let fullText = "";
    const audio = document.getElementById('bgMusic');

    if (hash) {
        try {
            fullText = decodeURIComponent(escape(atob(hash)));
            document.getElementById('creatorArea').style.display = 'none';
            document.getElementById('musicBar').style.display = 'block';
            typeWriter();
            setInterval(createHeart, 500);
        } catch(e) { console.log("Error"); }
    }

    function typeWriter() {
        if (index < fullText.length) {
            document.getElementById("typing-text").innerHTML += fullText.charAt(index);
            index++;
            setTimeout(typeWriter, 60);
        }
    }

    function toggleMusic() {
        if (audio.paused) {
            audio.play();
            document.getElementById('btnText').innerText = "توقف آهنگ ⏸️";
        } else {
            audio.pause();
            document.getElementById('btnText').innerText = "پخش آهنگ 🎧";
        }
    }

    function createHeart() {
        const h = document.createElement('div');
        h.className = 'heart';
        h.innerHTML = ['🥺', '💖', '✨', '🩹'][Math.floor(Math.random() * 4)];
        h.style.left = Math.random() * 100 + 'vw';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 4000);
    }

    function makeLink() {
        const val = document.getElementById('textInput').value;
        if(!val) return;
        const encoded = btoa(unescape(encodeURIComponent(val)));
        const finalLink = window.location.origin + window.location.pathname + "#" + encoded;
        document.getElementById('resultLink').innerText = finalLink;
        alert("لینک ساخته شد!");
    }
</script>

</body>
</html>

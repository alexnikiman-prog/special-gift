<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        body { margin: 0; background: #050810; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #intro-page { position: fixed; width: 100%; height: 100%; background: #050810; display: flex; justify-content: center; align-items: center; z-index: 100; transition: 0.8s; }
        #intro-btn { background: none; border: 2px solid #38bdf8; color: #38bdf8; padding: 15px 30px; border-radius: 50px; cursor: pointer; font-size: 16px; }
        .container { text-align: center; display: none; width: 90%; max-width: 400px; background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .profile-img { width: 100%; max-height: 250px; border-radius: 15px; object-fit: contain; margin-bottom: 20px; border: 2px solid #38bdf8; }
        #typing-text { font-size: 18px; line-height: 1.6; margin-bottom: 20px; min-height: 60px; }
        textarea { width: 100%; height: 80px; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.3); color: white; border: 1px solid #38bdf8; }
        .magic-btn { background: #38bdf8; border: none; padding: 12px 25px; border-radius: 25px; color: #000; font-weight: bold; cursor: pointer; }
        .heart { position: absolute; font-size: 20px; animation: fall 4s linear infinite; pointer-events: none; }
        @keyframes fall { 0% { transform: translateY(-10vh); } 100% { transform: translateY(110vh); } }
    </style>
</head>
<body>

<div id="intro-page">
    <button id="intro-btn" onclick="start()">OPEN YOUR GIFT 🎁</button>
</div>

<div class="container" id="mainBox">
    <img src="photo.jpg" class="profile-img" onerror="this.src='https://via.placeholder.com/300?text=Photo+Not+Found'">
    <div id="typing-text"></div>
    
    <div id="creatorArea">
        <textarea id="textInput" placeholder="پیام آشتی رو اینجا بنویس..."></textarea>
        <button class="magic-btn" onclick="makeLink()">ساخت لینک جادویی ✨</button>
        <p id="resultLink" style="font-size: 10px; color: #38bdf8; margin-top: 15px; word-break: break-all;"></p>
    </div>
</div>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
    const hash = window.location.hash.substring(1);
    let index = 0;
    let fullText = "";

    if (hash) {
        try {
            fullText = decodeURIComponent(escape(atob(hash)));
            document.getElementById('creatorArea').style.display = 'none';
        } catch(e) { console.log("Error decoding hash"); }
    }

    function start() {
        document.getElementById('intro-page').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('intro-page').style.display = 'none';
            document.getElementById('mainBox').style.display = 'block';
            
            const audio = document.getElementById('bgMusic');
            audio.play().catch(e => console.log("Playback failed"));
            
            if (fullText) {
                typeWriter();
                setInterval(createHeart, 400);
            }
        }, 800);
    }

    function typeWriter() {
        if (index < fullText.length) {
            document.getElementById("typing-text").innerHTML += fullText.charAt(index);
            index++;
            setTimeout(typeWriter, 50);
        }
    }

    function createHeart() {
        const h = document.createElement('div');
        h.className = 'heart';
        const em = ['🥺', '💖', '✨', '🩹'];
        h.innerHTML = em[Math.floor(Math.random() * em.length)];
        h.style.left = Math.random() * 100 + 'vw';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 4000);
    }

    function makeLink() {
        const val = document.getElementById('textInput').value;
        const encoded = btoa(unescape(encodeURIComponent(val)));
        const finalLink = window.location.origin + window.location.pathname + "#" + encoded;
        document.getElementById('resultLink').innerText = finalLink;
        alert("لینک کپی شد!");
    }
</script>

</body>
</html>
